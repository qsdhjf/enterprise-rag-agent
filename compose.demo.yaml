services:
  agent:
    build: .
    command: ["enterprise-agent-serve", "--mode", "demo", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${AGENT_DEMO_PORT:-8010}:8000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - demo-knowledge:/data/knowledge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  demo-knowledge:
